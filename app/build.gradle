plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'uz.hybrid.tts'
    compileSdk 34

    defaultConfig {
        applicationId "uz.hybrid.tts"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters 'arm64-v8a' // Zamonaviy Android telefonlar uchun (APK hajmini kichik ushlaydi)
        }
    }

    aaptOptions {
        noCompress "onnx" // Model faylini siqmasdan tez ochish uchun majburiy!
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    // Sherpa-ONNX rasmiy Android kutubxonasi
    implementation 'com.k2fsa.sherpa.onnx:sherpa-onnx-android:1.10.30'
}
